<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佛经打字-抄写-默写</title>
<style>
:root{
    --primary:#9C7A3C;
    --accent:#C0574F;
    --success:#2EA44F;
    --bg:#F7F4EE;
    --card-bg:#FFFFFF;
    --bar-bg:#FFFFFF;
    --chip-bg:#F3EFE6;
    --text-main:#3A3428;
    --text-sub:#8D8574;
    --ch-ok:#2EA44F;
    --ch-bad:#C0574F;
    --ch-cur:#9C7A3C;
    --ch-normal:#B9B2A2;
    --zone-bg:#FBF9F4;
    --zone-border:#E7E0D0;
    --track:#EAE4D6;
    --line:#E3DCCB;
    --cur-bg:rgba(156,122,60,.14);
    color-scheme:light;
}
[data-theme="dark"]{
    --primary:#D2B26A;
    --accent:#E08A80;
    --success:#4CC36B;
    --bg:#16140F;
    --card-bg:#1F1C15;
    --bar-bg:#1F1C15;
    --chip-bg:#2A261C;
    --text-main:#EDE7D8;
    --text-sub:#A29A85;
    --ch-ok:#4CC36B;
    --ch-bad:#E08A80;
    --ch-cur:#D2B26A;
    --ch-normal:#6E6754;
    --zone-bg:#1A1710;
    --zone-border:#37311F;
    --track:#322C1E;
    --line:#37311F;
    --cur-bg:rgba(210,178,106,.18);
    color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg);color:var(--text-main);
    min-height:100vh;transition:background .25s,color .25s;
}
#ui-container{max-width:980px;margin:0 auto;padding:16px 16px 48px;}

/* ---------- 顶栏 ---------- */
.top-bar{
    background:var(--bar-bg);border-radius:14px;padding:12px 18px;
    box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:18px;
}
.top-bar-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.app-title{font-size:19px;font-weight:700;letter-spacing:1px;}
.top-bar-right{display:flex;align-items:center;gap:14px;}
.vol-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-sub);cursor:pointer;}
.vol-label input{width:90px;cursor:pointer;accent-color:var(--primary);}
#key-volume-label{min-width:38px;text-align:right;font-variant-numeric:tabular-nums;}
.btn-icon{
    border:1px solid var(--line);background:var(--chip-bg);border-radius:8px;
    font-size:16px;padding:4px 9px;cursor:pointer;line-height:1.2;
}
.btn-icon:hover{border-color:var(--primary);}
.stats-bar{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.stat{font-size:13px;color:var(--text-sub);}
.stat b{color:var(--text-main);font-variant-numeric:tabular-nums;}

/* ---------- 选经 ---------- */
.page-head{text-align:center;margin:14px 0 22px;}
.page-head h1{font-size:24px;letter-spacing:2px;margin-bottom:8px;font-family:"Kaiti SC","KaiTi","STKaiti",serif;}
.page-head p{font-size:13px;color:var(--text-sub);}
.sutra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.sutra-card{
    background:var(--card-bg);border:1px solid var(--line);border-radius:14px;
    padding:18px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;
    display:flex;flex-direction:column;gap:8px;
}
.sutra-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.10);border-color:var(--primary);}
.sutra-title{font-size:18px;font-weight:700;font-family:"Kaiti SC","KaiTi","STKaiti",serif;letter-spacing:1px;}
.sutra-author{font-size:12px;color:var(--text-sub);}
.sutra-desc{font-size:13px;color:var(--text-sub);line-height:1.6;flex:1;}
.sutra-meta{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
    font-size:12px;background:var(--chip-bg);color:var(--text-sub);
    padding:3px 10px;border-radius:20px;
}
.chip.best{color:var(--primary);font-weight:700;}
.sutra-actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}

/* ---------- 按钮 ---------- */
.btn{
    border-radius:9px;padding:8px 18px;font-size:14px;cursor:pointer;
    border:1px solid transparent;transition:opacity .15s,background .15s;
}
.btn:hover{opacity:.85;}
.btn.primary{background:var(--primary);color:#fff;font-weight:600;}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text-main);}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary);}
.btn.sm{padding:5px 12px;font-size:13px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn:disabled:hover{opacity:.35;border-color:var(--line);color:var(--text-main);}

/* ---------- 打字区 ---------- */
.game-card{
    background:var(--card-bg);border:1px solid var(--line);border-radius:16px;
    padding:20px 22px;box-shadow:0 10px 25px rgba(0,0,0,.06);
}
.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.game-title{font-size:17px;font-weight:700;font-family:"Kaiti SC","KaiTi","STKaiti",serif;letter-spacing:1px;}
.game-sub{font-size:12px;color:var(--text-sub);}
.progress-track{height:6px;background:var(--track);border-radius:6px;overflow:hidden;margin-bottom:18px;}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--success));border-radius:6px;transition:width .3s;}

#text-zone{
    background:var(--zone-bg);border:1px solid var(--zone-border);border-radius:12px;
    padding:22px 20px;min-height:150px;
    display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px 0;
    line-height:1;
}
.tk{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:0 3px 6px;border-radius:8px;position:relative;
    transition:background .12s;
}
.tk .py{
    font-family:"SFMono-Regular",Consolas,"Courier New",monospace;
    font-size:12px;letter-spacing:.3px;color:var(--ch-normal);
    height:18px;line-height:18px;white-space:nowrap;
}
.tk .ch{
    font-family:"Kaiti SC","KaiTi","STKaiti","Songti SC",serif;
    font-size:30px;line-height:1.25;color:var(--ch-normal);
    transition:color .12s,transform .12s;
}
.tk.done .ch{color:var(--ch-ok);}
.tk.done .py{color:var(--ch-ok);opacity:.55;}
.tk.cur{background:var(--cur-bg);}
.tk.cur .ch{color:var(--ch-cur);font-weight:700;}
.tk.cur .py{color:var(--ch-cur);}
.tk.err{animation:shake .22s;}
.tk.err .ch{color:var(--ch-bad);}
.tk.err .py{color:var(--ch-bad);}
.tk.punc{padding:0 1px 6px;}
.tk.punc .ch{font-size:24px;}
@keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
}

/* ---------- 模式切换 ---------- */
.mode-switch{
    display:inline-flex;background:var(--chip-bg);border:1px solid var(--line);
    border-radius:24px;padding:3px;gap:2px;margin-top:14px;
}
.mode-switch button{
    border:none;background:transparent;color:var(--text-sub);
    font-size:14px;padding:7px 22px;border-radius:20px;cursor:pointer;font-weight:600;
    transition:background .15s,color .15s;
}
.mode-switch button.on{background:var(--primary);color:#fff;}

/* ---------- 对照抄写 ---------- */
.tk.bad .ch{color:var(--ch-bad);text-decoration:underline wavy var(--ch-bad);}

/* ---------- 默写（不显示原文，对绿错红） ---------- */
#text-zone.recite .tk{padding-bottom:2px;}
#text-zone.recite .tk .ch{color:var(--ch-normal);}
#text-zone.recite .tk.cur .ch{color:var(--ch-cur);background:var(--cur-bg);border-radius:6px;}
#text-zone.recite .tk.ok .ch{color:var(--ch-ok);}
#text-zone.recite .tk.bad .ch{color:var(--ch-bad);}
#text-zone.recite .tk.punc .ch{color:var(--text-sub);}
/* 默写模式隐藏统计（不需要结果统计） */
.stats-bar.recite .stat.opt{display:none;}

/* ---------- 极简模式 ---------- */
.btn-text{
    border:none;background:transparent;color:var(--text-sub);
    font-size:12px;cursor:pointer;opacity:.5;padding:5px 7px;letter-spacing:1px;
    transition:opacity .15s,color .15s;
}
.btn-text:hover{opacity:1;color:var(--primary);}
#minimal-badge{
    position:fixed;top:8px;right:10px;z-index:99;
    border:none;background:transparent;color:var(--text-sub);
    font-size:11px;letter-spacing:1px;cursor:pointer;padding:5px 9px;
    opacity:.22;transition:opacity .2s;
}
#minimal-badge:hover{opacity:.85;}
body:not(.minimal) #minimal-badge{display:none;}

body.minimal .top-bar,
body.minimal .game-head,
body.minimal .progress-track,
body.minimal .hint-line{display:none !important;}
body.minimal #ui-container{max-width:100%;padding:7vh 7vw;}
body.minimal .game-card{
    background:transparent;border:none;box-shadow:none;padding:0;
}
body.minimal #text-zone{
    background:transparent;border:none;padding:0;
    justify-content:center;min-height:auto;
}
body.minimal .tk{padding:0 5px 10px;}
body.minimal .tk .ch{font-size:42px;}
body.minimal .tk.punc .ch{font-size:32px;}
body.minimal .copy-input-wrap{margin-top:5vh;}
body.minimal #copy-input{
    background:transparent;border:none;border-bottom:1px solid var(--line);
    border-radius:0;text-align:center;font-size:30px;
}
body.minimal #copy-input:focus{border-bottom-color:var(--primary);}
.copy-input-wrap{margin-top:16px;}
#copy-input{
    width:100%;font-size:24px;line-height:1.6;padding:12px 16px;
    border:2px solid var(--zone-border);border-radius:12px;background:var(--zone-bg);
    color:var(--text-main);outline:none;letter-spacing:3px;
    font-family:"Kaiti SC","KaiTi","STKaiti","Songti SC",serif;
    transition:border-color .15s;
}
#copy-input:focus{border-color:var(--primary);}
#copy-input::placeholder{color:var(--text-sub);font-size:16px;letter-spacing:1px;}

.hint-line{margin-top:14px;font-size:12px;color:var(--text-sub);line-height:1.8;text-align:center;}
.hint-line kbd{
    font-family:Consolas,monospace;background:var(--chip-bg);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;color:var(--text-main);
}

/* ---------- 结算 ---------- */
.end-card{
    background:var(--card-bg);border:1px solid var(--line);border-radius:16px;
    padding:30px 26px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.06);
}
.end-title{
    font-size:26px;font-family:"Kaiti SC","KaiTi","STKaiti",serif;letter-spacing:3px;
    margin-bottom:6px;color:var(--primary);
}
.end-sub{font-size:13px;color:var(--text-sub);margin-bottom:22px;}
.end-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px;
}
.end-cell{background:var(--zone-bg);border:1px solid var(--zone-border);border-radius:12px;padding:14px 10px;}
.end-cell .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
.end-cell .k{font-size:12px;color:var(--text-sub);margin-top:4px;}
.end-cell.good .v{color:var(--success);}
.end-cell.bad .v{color:var(--accent);}
.wrong-box{
    text-align:left;background:var(--zone-bg);border:1px solid var(--zone-border);
    border-radius:12px;padding:14px 16px;margin-bottom:22px;
}
.wrong-box h3{font-size:13px;color:var(--text-sub);font-weight:600;margin-bottom:10px;}
.wrong-list{display:flex;flex-wrap:wrap;gap:8px;}
.wrong-item{
    display:inline-flex;align-items:center;gap:6px;background:var(--card-bg);
    border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;
}
.wrong-item .wc{font-family:"Kaiti SC","KaiTi",serif;font-size:16px;}
.wrong-item .wp{font-family:Consolas,monospace;color:var(--text-sub);font-size:12px;}
.wrong-item .wn{color:var(--accent);font-weight:700;font-size:12px;}
.wrong-empty{font-size:13px;color:var(--success);}
.end-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* ---------- 选分页（大部经文按“分”练习） ---------- */
.chapter-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.chapter-card{
    background:var(--card-bg);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;text-align:left;
    font-family:inherit;color:var(--text-main);
    transition:transform .15s,border-color .15s,box-shadow .15s;
}
.chapter-card:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 6px 16px rgba(0,0,0,.08);}
.chapter-card .cn{font-size:14px;font-weight:700;font-family:"Kaiti SC","KaiTi","STKaiti",serif;letter-spacing:.5px;}
.chapter-card .cm{font-size:12px;color:var(--text-sub);margin-top:5px;line-height:1.5;}
.chapter-card.resume{border-color:var(--primary);}
.chapter-card.resume .cm{color:var(--primary);font-weight:600;}

/* ---------- 懒加载提示 ---------- */
#loading-tip{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;
    background:var(--card-bg);border:1px solid var(--primary);color:var(--text-main);
    border-radius:24px;padding:9px 20px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.16);
}

.hidden{display:none !important;}
.fade-in{animation:fadeIn .3s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

@media (max-width:600px){
    .tk .ch{font-size:24px;}
    .tk .py{font-size:11px;}
    #text-zone{padding:16px 12px;}
    .game-card{padding:16px 14px;}
}
</style>
<script>
// 尽早应用已保存主题，避免刷新闪白（与 e.html / fc.html 共用同一 key）
(function () {
    try {
        var saved = localStorage.getItem('example_typing_theme_v1');
        var dark = saved ? saved === 'dark'
            : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* 隐私模式等读取失败时保持日间 */ }
})();
</script>
</head>
<body>
<button id="minimal-badge" type="button" title="退出极简（Esc）">✕ 退出极简</button>
<div id="ui-container">

    <!-- 顶栏 -->
    <div class="top-bar">
        <div class="top-bar-row">
            <div class="app-title">🪷 佛经打字修行 <a href="e.html" style="font-size:12px;color:var(--text-sub);text-decoration:none;" title="回例句打字">↩ 例句</a></div>
            <div class="top-bar-right">
                <label class="vol-label" title="按键音量">
                    🔉 <input id="key-volume" type="range" min="0" max="200" value="100">
                    <span id="key-volume-label">100%</span>
                </label>
                <button id="btn-theme" class="btn-icon" type="button" title="切换夜间模式">🌙</button>
            </div>
        </div>
        <div class="stats-bar" id="stats-bar">
            <span class="stat">📖 <b id="stat-sutra">—</b></span>
            <span class="stat">📌 第 <b id="stat-sec">0</b> / <span id="stat-sec-total">0</span> 句</span>
            <span class="stat opt">⏱ <b id="stat-time">00:00</b></span>
            <span class="stat opt">🎯 准确率 <b id="stat-acc">100%</b></span>
            <span class="stat opt">🚀 <b id="stat-cpm">0</b> 字/分</span>
        </div>
    </div>

    <!-- 选经页 -->
    <div id="page-select">
        <div class="page-head">
            <h1>选一部经，随文入定</h1>
            <p id="page-head-tip">屏幕显示经文与拼音，用<b>中文输入法</b>在输入框逐字抄写，整句抄对自动进入下一句</p>
            <div class="mode-switch" id="mode-switch">
                <button type="button" data-mode="copy">✍️ 对照抄写</button>
                <button type="button" data-mode="recite">🧘 默写</button>
            </div>
        </div>
        <div class="sutra-grid" id="sutra-grid"></div>
    </div>

    <!-- 选分页（仅多章经文进入） -->
    <div id="page-chapter" class="hidden">
        <div class="page-head">
            <h1 id="chapter-head-title">—</h1>
            <p>选择要修习的分，或一次连打全本</p>
        </div>
        <div class="chapter-actions">
            <button id="btn-chapter-all" class="btn primary" type="button">📖 全本连续</button>
            <button id="btn-chapter-back" class="btn ghost" type="button">← 返回选经（Esc）</button>
        </div>
        <div class="chapter-grid" id="chapter-grid"></div>
    </div>

    <!-- 打字页 -->
    <div id="page-game" class="hidden">
        <div class="game-card">
            <div class="game-head">
                <div>
                    <div class="game-title" id="game-title">—</div>
                    <div class="game-sub" id="game-sub">—</div>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <button id="btn-minimal" class="btn-text" type="button" title="隐藏非必要元素（Esc 或右上角标退出）">极简</button>
                    <button id="btn-prev-sec" class="btn ghost sm" type="button" title="上一句（Alt + ←）">← 上一句</button>
                    <button id="btn-next-sec" class="btn ghost sm" type="button" title="下一句（Alt + →）">下一句 →</button>
                    <button id="btn-restart" class="btn ghost sm" type="button" title="从本句重新开始">↻ 重打本句</button>
                    <button id="btn-quit" class="btn ghost sm" type="button" title="返回选经（Esc）">✕ 退出</button>
                </div>
            </div>
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
            <div id="text-zone"></div>
            <div class="copy-input-wrap" id="copy-wrap">
                <input id="copy-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="用中文输入法在此逐字抄写经文…">
            </div>
            <div class="hint-line" id="hint-line">
                用中文输入法逐字抄写 · 错字标红波浪线 · 整句抄对自动下一句 · <kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd> 上/下一句 · <kbd>Esc</kbd> 退出
            </div>
        </div>
    </div>

    <!-- 结算页 -->
    <div id="page-end" class="hidden">
        <div class="end-card fade-in">
            <div class="end-title" id="end-title">圆满</div>
            <div class="end-sub" id="end-sub">—</div>
            <div class="end-grid" id="end-grid"></div>
            <div class="wrong-box" id="wrong-box">
                <h3>错字排行（本次）</h3>
                <div class="wrong-list" id="wrong-list"></div>
            </div>
            <div class="end-actions">
                <button id="btn-again" class="btn primary" type="button">↻ 再修一遍</button>
                <button id="btn-next" class="btn ghost" type="button">→ 下一部经</button>
                <button id="btn-back" class="btn ghost" type="button">📖 返回选经</button>
            </div>
        </div>
    </div>

<script>
'use strict';

// ============================================================
// 数据与常量
// ============================================================
// 内置短经（内联数据）；大部经文只在 EXTERNAL_SUTRAS 登记元数据，点击时才懒加载正文
var SUTRAS = JSON.parse(document.getElementById('sutra-data').textContent);

// ---- 大部经注册表：src 指向 data/*.js（window.__SUTRA_LOAD__ 格式）----
// script 注入加载，file:// 双击打开也不受 CORS 限制（fetch 会）
var EXTERNAL_SUTRAS = [
    {
        id: 'jingang_full',
        title: '金刚般若波罗蜜经',
        author: '姚秦 · 鸠摩罗什 译',
        desc: '全文三十二分，可选分练习。',
        src: 'data/jingang_full.js',
        hanCount: 5100,   // 估值，加载完成后以真实数据为准
        chapters: 32      // 未加载时 chapters 是数字（仅展示用）
    }
    // 阿弥陀经：用 tools/txt2sutra.py 生成 data/amituo_full.js 后，在此追加一条
];

// 懒加载回调：数据文件执行时把完整数据登记到这里
var LOADED_SUTRAS = {};
window.__SUTRA_LOAD__ = function (data) {
    if (data && data.id) LOADED_SUTRAS[data.id] = data;
};

// 加载一部大经（已加载则直接返回），Promise<完整数据>
function loadSutraData(meta) {
    if (LOADED_SUTRAS[meta.id]) return Promise.resolve(LOADED_SUTRAS[meta.id]);
    return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = meta.src;
        s.charset = 'utf-8';
        s.onload = function () {
            s.remove();
            var d = LOADED_SUTRAS[meta.id];
            if (d) resolve(d);
            else reject(new Error('数据文件未调用 __SUTRA_LOAD__：' + meta.src));
        };
        s.onerror = function () { s.remove(); reject(new Error('经文数据加载失败：' + meta.src)); };
        document.head.appendChild(s);
    });
}

// 统一数据形状：内置经无 chapters 字段，包装成单章结构
SUTRAS.forEach(function (s) {
    if (!s.chapters) s.chapters = [{ title: '全文', sections: s.sections }];
});
EXTERNAL_SUTRAS.forEach(function (m) { SUTRAS.push(m); });

var THEME_STORAGE = 'example_typing_theme_v1';   // 与 e.html / fc.html 共用
var KEY_VOLUME_STORAGE = 'typingKeyVolume';      // 与 typing.html 共用
var PROGRESS_KEY = 'sutra_typing_progress_v3';   // 断点续打（按模式分开；v3 起含 chIdx）
var BEST_KEY = 'sutra_typing_best_v2';           // 每部经最佳成绩（按模式分开，结构未变沿用 v2）
var MODE_KEY = 'sutra_typing_mode_v1';           // 上次选择的模式
var MINIMAL_KEY = 'sutra_typing_minimal_v1';     // 极简模式开关

var MODE = 'copy';   // 'copy' 对照抄写 | 'recite' 默写
var MINIMAL = false;   // 极简模式：隐藏非必要元素

// 切换极简模式（隐藏/恢复顶栏、按钮、进度条等非必要元素）
function setMinimal(on) {
    MINIMAL = on;
    document.body.classList.toggle('minimal', on);
    try { localStorage.setItem(MINIMAL_KEY, on ? '1' : '0'); } catch (e) {}
    // 极简下隐藏了退出按钮，把焦点还给输入框方便继续
    if (on && S && !S.finished) {
        els.copyInput.focus();
    }
}

var els = {
    pageSelect: document.getElementById('page-select'),
    pageChapter: document.getElementById('page-chapter'),
    pageGame: document.getElementById('page-game'),
    pageEnd: document.getElementById('page-end'),
    grid: document.getElementById('sutra-grid'),
    chapterGrid: document.getElementById('chapter-grid'),
    chapterHeadTitle: document.getElementById('chapter-head-title'),
    loadingTip: document.getElementById('loading-tip'),
    textZone: document.getElementById('text-zone'),
    progressFill: document.getElementById('progress-fill'),
    gameTitle: document.getElementById('game-title'),
    gameSub: document.getElementById('game-sub'),
    copyInput: document.getElementById('copy-input'),
    hintLine: document.getElementById('hint-line'),
    modeSwitch: document.getElementById('mode-switch'),
    pageHeadTip: document.getElementById('page-head-tip'),
    statSutra: document.getElementById('stat-sutra'),
    statSec: document.getElementById('stat-sec'),
    statSecTotal: document.getElementById('stat-sec-total'),
    statTime: document.getElementById('stat-time'),
    statAcc: document.getElementById('stat-acc'),
    statCpm: document.getElementById('stat-cpm'),
    endTitle: document.getElementById('end-title'),
    endSub: document.getElementById('end-sub'),
    endGrid: document.getElementById('end-grid'),
    wrongList: document.getElementById('wrong-list'),
    keyVolume: document.getElementById('key-volume'),
    keyVolumeLabel: document.getElementById('key-volume-label'),
    btnTheme: document.getElementById('btn-theme'),
    btnPrevSec: document.getElementById('btn-prev-sec'),
    btnNextSec: document.getElementById('btn-next-sec'),
};

// ============================================================
// 音效（播放 /Default.wav，音量跟随滑块）
// ============================================================
var keyClickAudio = null;
function getKeyClickAudio() {
    if (!keyClickAudio) {
        keyClickAudio = new Audio('Default.wav');   // 与本文件同目录
        keyClickAudio.preload = 'auto';
    }
    return keyClickAudio;
}
function playKeyClick(volume) {
    try {
        var audio = getKeyClickAudio();
        audio.volume = Math.max(0, Math.min(1, volume === undefined ? 1 : volume));
        audio.currentTime = 0;
        audio.play().catch(function () {});
    } catch (e) { /* 音频不可用时静默 */ }
}
function getKeyVolume() {
    var v = parseFloat(els.keyVolume.value);
    return isNaN(v) ? 1 : v / 100;
}

// ============================================================
// 存储工具
// ============================================================
function loadJSON(key, fallback) {
    try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
}
function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 忽略 */ }
}
function getProgress() { return (loadJSON(PROGRESS_KEY, {}))[MODE] || {}; }
function saveProgress(id, val) {
    var all = loadJSON(PROGRESS_KEY, {});
    if (!all[MODE]) all[MODE] = {};
    if (val === null) delete all[MODE][id];
    else all[MODE][id] = val;
    saveJSON(PROGRESS_KEY, all);
}
function getBest() { return (loadJSON(BEST_KEY, {}))[MODE] || {}; }
function saveBest(id, val) {
    var all = loadJSON(BEST_KEY, {});
    if (!all[MODE]) all[MODE] = {};
    all[MODE][id] = val;
    saveJSON(BEST_KEY, all);
}

// ============================================================
// 主题与音量
// ============================================================
function applyTheme(dark) {
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    els.btnTheme.textContent = dark ? '☀️' : '🌙';
    try { localStorage.setItem(THEME_STORAGE, dark ? 'dark' : 'light'); } catch (e) {}
}
function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function restoreVolume() {
    try {
        var v = localStorage.getItem(KEY_VOLUME_STORAGE);
        if (v === null) return;
        var n = parseInt(v, 10);
        if (!isNaN(n) && n >= 0 && n <= 200) {
            els.keyVolume.value = n;
            els.keyVolumeLabel.textContent = n + '%';
        }
    } catch (e) {}
}

// ============================================================
// 游戏状态
// ============================================================
var S = null;   // 当前局状态
var timer = null;

// fullBook=true 时跨章连续打完整本，否则只打 sutra.chapters[chIdx] 一章
function newGame(sutra, chIdx, startSec, fullBook) {
    var scope = fullBook ? sutra.chapters : [sutra.chapters[chIdx || 0]];
    var totalHan = 0;
    scope.forEach(function (ch) {
        ch.sections.forEach(function (sec) {
            sec.forEach(function (t) { if (t[1]) totalHan++; });
        });
    });
    S = {
        sutra: sutra,
        chIdx: chIdx || 0,
        secIdx: startSec || 0,
        fullBook: !!fullBook,
        tokIdx: 0,
        startTime: null,
        elapsed: 0,
        typedHan: 0,      // 已正确打完的汉字数
        totalHan: totalHan,
        correctKeys: 0,
        wrongKeys: 0,
        wrongMap: {},     // 字 -> {py, n}
        finished: false,
        nodes: [],
        copyTargets: [],  // 抄写模式：当前句汉字 token 下标
        copyWrongPos: {}, // 抄写模式：已记录的错误位置（避免重复计数）
        copyDoneBase: 0,  // 抄写模式：已完成句子的累计正确字数
        copyAdvancing: false, // 抄写模式：正在切句防抖标记
        originBase: 0,    // 开局位置之前的累计汉字数（续打/跳句时用于修正统计）
    };
    S.originBase = absBase();
}

// ---- 句子定位工具（供上/下一句跳转使用）----
// 本局范围内的章节列表：全本为全部章，否则只有当前章
function scopeChapters() {
    return S.fullBook ? S.sutra.chapters : [S.sutra.chapters[S.chIdx]];
}
// 把范围内的句子摊平成一维数组
function scopeSections() {
    var list = [];
    scopeChapters().forEach(function (ch) {
        ch.sections.forEach(function (sec) { list.push(sec); });
    });
    return list;
}
// 当前章在范围内之前共有多少句
function secOffset() {
    if (!S.fullBook) return 0;
    var n = 0;
    for (var i = 0; i < S.chIdx; i++) n += S.sutra.chapters[i].sections.length;
    return n;
}
function hanCount(sec) {
    var n = 0;
    sec.forEach(function (t) { if (t[1]) n++; });
    return n;
}
// 当前句之前（范围内）的累计汉字数
function absBase() {
    var list = scopeSections();
    var cur = secOffset() + S.secIdx;
    var n = 0;
    for (var i = 0; i < cur && i < list.length; i++) n += hanCount(list[i]);
    return n;
}
// 是否处于范围的首句 / 末句
function atFirstSec() {
    return S.secIdx === 0 && (!S.fullBook || S.chIdx === 0);
}
function atLastSec() {
    var ch = curChapter();
    var last = S.secIdx >= ch.sections.length - 1;
    return last && (!S.fullBook || S.chIdx >= S.sutra.chapters.length - 1);
}

// 跳转 delta 句（-1 上一句 / +1 下一句），跨章自动衔接
function gotoSection(delta) {
    if (!S || S.finished || S.copyAdvancing) return;
    if (delta < 0 && atFirstSec()) return;
    if (delta > 0 && atLastSec()) return;

    var nci = S.chIdx, ni = S.secIdx + delta;
    if (ni < 0) {
        nci--;
        ni = S.sutra.chapters[nci].sections.length - 1;
    } else if (ni >= curChapter().sections.length) {
        nci++;
        ni = 0;
    }
    S.chIdx = nci;
    S.secIdx = ni;
    S.tokIdx = 0;
    // 修正累计字数（不允许为负：往回跳到开局之前的句子时归零）
    S.copyDoneBase = Math.max(0, absBase() - S.originBase);
    S.correctKeys = S.copyDoneBase;
    S.typedHan = S.copyDoneBase;

    saveProgress(S.sutra.id, { chIdx: S.chIdx, secIdx: S.secIdx, ts: Date.now() });
    renderSection();
    els.copyInput.focus();
}

// 首句禁用“上一句”，末句禁用“下一句”
function updateNavButtons() {
    if (!els.btnPrevSec || !els.btnNextSec) return;
    var on = !!(S && !S.finished);
    els.btnPrevSec.disabled = !on || atFirstSec();
    els.btnNextSec.disabled = !on || atLastSec();
}

// ============================================================
// 渲染选经页
// ============================================================
function fmtTime(sec) {
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function renderSelect() {
    var best = getBest(), prog = getProgress();
    // 同步模式切换按钮与提示文案
    Array.prototype.forEach.call(els.modeSwitch.querySelectorAll('button'), function (b) {
        b.classList.toggle('on', b.getAttribute('data-mode') === MODE);
    });
    els.pageHeadTip.innerHTML = MODE === 'recite'
        ? '屏幕<b>不显示经文</b>，凭记忆默写；写对的字显示绿色，写错显示红色，不计成绩'
        : '屏幕显示经文与拼音，用<b>中文输入法</b>在输入框逐字抄写，整句抄对自动进入下一句';
    els.grid.innerHTML = '';
    SUTRAS.forEach(function (sutra, i) {
        var card = document.createElement('div');
        card.className = 'sutra-card';
        card.setAttribute('role', 'button');
        card.tabIndex = 0;

        // 大部经未加载时 chapters 是数字（仅展示）；已加载/内置经是数组
        var loaded = Array.isArray(sutra.chapters);
        var chCount = loaded ? sutra.chapters.length : (sutra.chapters || 1);
        var secCount = loaded
            ? sutra.chapters.reduce(function (n, ch) { return n + ch.sections.length; }, 0)
            : null;

        var b = best[sutra.id];
        var p = prog[sutra.id];
        var meta = '<span class="chip">' + sutra.hanCount + (loaded ? '' : '+') + ' 字</span>'
            + (chCount > 1 ? '<span class="chip">' + chCount + ' 分</span>' : '')
            + (secCount ? '<span class="chip">' + secCount + ' 句</span>' : '')
            + '<span class="chip">约 ' + Math.max(1, Math.round(sutra.hanCount / 40)) + ' 分钟</span>';
        if (!loaded) meta += '<span class="chip">📦 点击时加载</span>';
        if (b) meta += '<span class="chip best">🏆 ' + b.acc + '% · ' + b.cpm + ' 字/分</span>';
        if (p && (p.secIdx > 0 || p.chIdx > 0)) {
            meta += '<span class="chip">⏸ 上次到' + (chCount > 1 ? '第 ' + ((p.chIdx || 0) + 1) + ' 分' : '') + '第 ' + (p.secIdx + 1) + ' 句</span>';
        }

        card.innerHTML =
            '<div class="sutra-title">' + sutra.title + '</div>' +
            '<div class="sutra-author">' + sutra.author + '</div>' +
            '<div class="sutra-desc">' + sutra.desc + '</div>' +
            '<div class="sutra-meta">' + meta + '</div>' +
            '<div class="sutra-actions">' +
                '<button class="btn primary sm" data-act="start" data-i="' + i + '">开始</button>' +
                (p && (p.secIdx > 0 || p.chIdx > 0)
                    ? '<button class="btn ghost sm" data-act="resume" data-i="' + i + '">续打</button>'
                    : '') +
            '</div>';
        els.grid.appendChild(card);
    });
}

// ============================================================
// 选分页（多章经文）
// ============================================================
var chapterSutra = null;   // 当前选分页对应的经文（已加载完整数据）

function renderChapters(sutra) {
    chapterSutra = sutra;
    els.chapterHeadTitle.textContent = sutra.title;
    var best = getBest(), prog = getProgress()[sutra.id] || {};
    els.chapterGrid.innerHTML = '';
    sutra.chapters.forEach(function (ch, ci) {
        var han = 0;
        ch.sections.forEach(function (sec) { sec.forEach(function (t) { if (t[1]) han++; }); });
        var isResume = (prog.chIdx || 0) === ci && prog.secIdx > 0 && prog.secIdx < ch.sections.length;
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'chapter-card' + (isResume ? ' resume' : '');
        card.setAttribute('data-ci', ci);
        card.innerHTML = '<div class="cn">' + escapeHtml(ch.title) + '</div>'
            + '<div class="cm">' + ch.sections.length + ' 句 · ' + han + ' 字 · 约 ' + Math.max(1, Math.round(han / 40)) + ' 分钟'
            + (isResume ? '<br>⏸ 续打第 ' + (prog.secIdx + 1) + ' 句' : '')
            + (best[sutra.id + '#' + ci] ? '<br>🏆 ' + best[sutra.id + '#' + ci].acc + '%' : '')
            + '</div>';
        els.chapterGrid.appendChild(card);
    });
}

// 点击经文卡片：多章 → 选分页；单章 → 直接开局；未加载 → 先懒加载
function openSutra(sutra, act) {
    var prog = getProgress()[sutra.id];
    if (!Array.isArray(sutra.chapters)) {
        els.loadingTip.classList.remove('hidden');
        loadSutraData(sutra).then(function (data) {
            els.loadingTip.classList.add('hidden');
            // 用完整数据替换注册表里的元数据占位
            var i = SUTRAS.findIndex(function (x) { return x.id === data.id; });
            if (i >= 0) SUTRAS[i] = data; else SUTRAS.push(data);
            openSutra(data, act);   // 重新进入（此时已是加载好的数据）
        }).catch(function (err) {
            els.loadingTip.classList.add('hidden');
            alert(err.message);
        });
        return;
    }
    if (sutra.chapters.length > 1) {
        if (act === 'resume' && prog) {
            startSutra(sutra, prog.chIdx || 0, prog.secIdx || 0, false);
        } else {
            renderChapters(sutra);
            showPage('chapter');
        }
        return;
    }
    startSutra(sutra, 0, act === 'resume' && prog ? (prog.secIdx || 0) : 0, false);
}

// ============================================================
// 渲染当前句
// ============================================================
function curChapter() { return S.sutra.chapters[S.chIdx]; }
function curSection() { return curChapter().sections[S.secIdx]; }

function renderSection() {
    var sec = curSection();
    els.textZone.innerHTML = '';
    els.textZone.classList.toggle('recite', MODE === 'recite');
    S.nodes = [];
    S.copyTargets = [];
    S.copyWrongPos = {};
    sec.forEach(function (t, idx) {
        var el = document.createElement('span');
        var isHan = !!t[1];
        el.className = 'tk' + (isHan ? '' : ' punc');
        // 默写模式：汉字显示为 □，拼音隐藏
        var chText = (MODE === 'recite' && isHan) ? '□' : t[0];
        var pyText = (MODE === 'recite' || !isHan) ? '&nbsp;' : t[1];
        el.innerHTML = '<span class="py">' + pyText + '</span>'
            + '<span class="ch">' + escapeHtml(chText) + '</span>';
        els.textZone.appendChild(el);
        S.nodes.push(el);
        if (isHan) S.copyTargets.push(idx);
    });
    // 跳过开头标点
    skipPunct();
    els.copyInput.value = '';
    if (MODE === 'recite') updateReciteState();
    else updateCopyState();
    updateHead();
}

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 当前 token 是标点则自动跳过；整句标点打完则进入下一句
function skipPunct() {
    var sec = curSection();
    while (S.tokIdx < sec.length && !sec[S.tokIdx][1]) {
        if (S.nodes[S.tokIdx]) S.nodes[S.tokIdx].classList.add('done');
        S.tokIdx++;
    }
    if (S.tokIdx >= sec.length) nextSection();
}

function nextSection() {
    S.secIdx++;
    S.tokIdx = 0;
    if (S.secIdx >= curChapter().sections.length) {
        // 本章打完：全本模式下进入下一章，否则结算
        if (S.fullBook && S.chIdx + 1 < S.sutra.chapters.length) {
            S.chIdx++;
            S.secIdx = 0;
        } else {
            finishGame();
            return;
        }
    }
    saveProgress(S.sutra.id, { chIdx: S.chIdx, secIdx: S.secIdx, ts: Date.now() });
    renderSection();
    els.copyInput.focus();
}

function updateHead() {
    var ch = curChapter();
    var multi = S.sutra.chapters.length > 1;
    var secNo = Math.min(S.secIdx + 1, ch.sections.length);
    els.gameTitle.textContent = S.sutra.title;
    els.gameSub.textContent = S.sutra.author
        + (multi ? ' · ' + ch.title : '')
        + ' · 第 ' + secNo + ' / ' + ch.sections.length + ' 句';
    els.statSutra.textContent = S.sutra.title + (multi ? ' · ' + ch.title : '');
    els.statSec.textContent = secNo;
    els.statSecTotal.textContent = ch.sections.length;
    var pct = S.totalHan ? (S.typedHan / S.totalHan * 100) : 0;
    els.progressFill.style.width = pct.toFixed(1) + '%';
    updateNavButtons();
}

function updateStats() {
    var total = S.correctKeys + S.wrongKeys;
    var acc = total ? Math.round(S.correctKeys / total * 100) : 100;
    els.statAcc.textContent = acc + '%';
    var mins = S.elapsed / 60;
    els.statCpm.textContent = mins > 0 ? Math.round(S.typedHan / mins) : 0;
    els.statTime.textContent = fmtTime(S.elapsed);
}

function ensureTimer() {
    if (S.startTime) return;
    S.startTime = Date.now();
    timer = setInterval(function () {
        S.elapsed = (Date.now() - S.startTime) / 1000;
        updateStats();
    }, 500);
}

// ============================================================
// 对照抄写模式
// ============================================================
function copyTargetChars() {
    var sec = curSection();
    if (!sec) return '';
    return S.copyTargets.map(function (i) { return sec[i][0]; }).join('');
}

// 逐字比对输入框与目标汉字，标记 done/cur/bad，整句正确则进下一句
function updateCopyState() {
    var sec = curSection();
    if (!sec) return;
    var target = copyTargetChars();
    var val = els.copyInput.value.replace(/\s/g, '');
    var firstBad = -1;

    for (var i = 0; i < target.length; i++) {
        var node = S.nodes[S.copyTargets[i]];
        node.classList.remove('done', 'cur', 'bad');
        if (i < val.length) {
            if (val[i] === target[i]) {
                node.classList.add('done');
            } else {
                node.classList.add('bad');
                if (firstBad < 0) firstBad = i;
                // 错字计数（每个位置只记一次）
                if (S.copyWrongPos[i] === undefined) {
                    S.copyWrongPos[i] = true;
                    S.wrongKeys++;
                    var tok = sec[S.copyTargets[i]];
                    var key = tok[0] + '|' + tok[1];
                    S.wrongMap[key] = (S.wrongMap[key] || 0) + 1;
                    node.classList.add('err');
                    (function (n) { setTimeout(function () { n.classList.remove('err'); }, 230); })(node);
                }
            }
        } else if (i === val.length) {
            node.classList.add('cur');
        }
    }

    // 已正确打出的字数（前缀匹配长度）
    var ok = 0;
    while (ok < val.length && ok < target.length && val[ok] === target[ok]) ok++;
    S.correctKeys = S.copyDoneBase + ok;   // 抄写模式以“字”为单位累计
    S.typedHan = S.copyDoneBase + ok;
    updateStats();

    // 整句抄对 → 进下一句（防抖：260ms 内重复 input 不重复推进）
    if (ok >= target.length && target.length > 0 && !S.copyAdvancing) {
        S.copyAdvancing = true;
        S.copyDoneBase += target.length;
        S.tokIdx = sec.length;
        setTimeout(function () { S.copyAdvancing = false; nextSection(); }, 260);
    }
}

// ============================================================
// 默写模式：不显示原文，写对显绿、写错显红，不计统计
// ============================================================
function updateReciteState() {
    var sec = curSection();
    if (!sec) return;
    var target = copyTargetChars();
    var val = els.copyInput.value.replace(/\s/g, '');

    for (var i = 0; i < target.length; i++) {
        var node = S.nodes[S.copyTargets[i]];
        var chEl = node.querySelector('.ch');
        node.classList.remove('ok', 'bad', 'cur');
        if (i < val.length) {
            if (val[i] === target[i]) {
                chEl.textContent = target[i];   // 写对：揭示原字，绿色
                node.classList.add('ok');
            } else {
                chEl.textContent = val[i];      // 写错：显示所写字，红色
                node.classList.add('bad');
            }
        } else {
            chEl.textContent = '□';
            if (i === val.length) node.classList.add('cur');
        }
    }

    // 进度条（仅用于推进展示，不计成绩）
    var ok = 0;
    while (ok < val.length && ok < target.length && val[ok] === target[ok]) ok++;
    S.typedHan = S.copyDoneBase + ok;
    updateHead();

    // 整句写对 → 下一句（防抖）
    if (ok >= target.length && target.length > 0 && !S.copyAdvancing) {
        S.copyAdvancing = true;
        S.copyDoneBase += target.length;
        S.tokIdx = sec.length;
        setTimeout(function () { S.copyAdvancing = false; nextSection(); }, 260);
    }
}

// ============================================================
// 按键处理（仅 Esc 退出/退出极简，输入由 input 事件处理）
// ============================================================
function onKey(e) {
    // Alt + ←/→：上一句 / 下一句
    if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        if (!S || S.finished || els.pageGame.classList.contains('hidden')) return;
        e.preventDefault();
        gotoSection(e.key === 'ArrowLeft' ? -1 : 1);
        return;
    }
    if (e.key !== 'Escape') return;
    // 选分页：Esc 退回选经
    if (!els.pageChapter.classList.contains('hidden')) {
        e.preventDefault();
        showPage('select');
        return;
    }
    if (!S || S.finished || els.pageGame.classList.contains('hidden')) return;
    e.preventDefault();
    if (MINIMAL) setMinimal(false);   // 极简下 Esc 先退出极简
    else quitGame();
}

// ============================================================
// 结算
// ============================================================
function finishGame() {
    S.finished = true;
    if (timer) { clearInterval(timer); timer = null; }
    S.elapsed = S.startTime ? (Date.now() - S.startTime) / 1000 : 0;
    updateNavButtons();   // 结算后禁用上/下一句

    // 清除续打记录
    saveProgress(S.sutra.id, null);

    // 成绩记录 key：单章练习记到 "经id#章idx"，全本/单章经记到 "经id"
    var multi = S.sutra.chapters.length > 1;
    var scoreKey = (multi && !S.fullBook) ? S.sutra.id + '#' + S.chIdx : S.sutra.id;
    var scopeName = (multi && !S.fullBook) ? curChapter().title : (S.fullBook ? '全本' : '');

    // 默写模式：不需要结果统计，只显示简单完成页
    if (MODE === 'recite') {
        els.endTitle.textContent = '圆满';
        els.endSub.textContent = S.sutra.title + (scopeName ? ' · ' + scopeName : '') + ' · ' + S.sutra.author + ' · 默写';
        els.endGrid.innerHTML = '';
        document.getElementById('wrong-box').classList.add('hidden');
        showPage('end');
        return;
    }
    document.getElementById('wrong-box').classList.remove('hidden');

    var total = S.correctKeys + S.wrongKeys;
    var acc = total ? Math.round(S.correctKeys / total * 100) : 100;
    var mins = S.elapsed / 60;
    var cpm = mins > 0 ? Math.round(S.typedHan / mins) : 0;

    // 更新最佳
    var best = getBest();
    var prev = best[scoreKey];
    var isNew = !prev || acc > prev.acc || (acc === prev.acc && cpm > prev.cpm);
    if (isNew) saveBest(scoreKey, { acc: acc, cpm: cpm, time: Math.round(S.elapsed) });

    els.endTitle.textContent = isNew ? '✦ 新纪录 · 圆满 ✦' : '圆满';
    els.endSub.textContent = S.sutra.title + (scopeName ? ' · ' + scopeName : '') + ' · ' + S.sutra.author + ' · 对照抄写';
    els.endGrid.innerHTML = [
        ['用时', fmtTime(S.elapsed), ''],
        ['准确率', acc + '%', acc >= 95 ? 'good' : (acc < 80 ? 'bad' : '')],
        ['速度', cpm + ' 字/分', ''],
        ['汉字数', S.typedHan, ''],
        ['错字数', S.wrongKeys, S.wrongKeys === 0 ? 'good' : 'bad'],
    ].map(function (c) {
        return '<div class="end-cell ' + c[2] + '"><div class="v">' + c[1] + '</div><div class="k">' + c[0] + '</div></div>';
    }).join('');

    var keys = Object.keys(S.wrongMap).sort(function (a, b) { return S.wrongMap[b] - S.wrongMap[a]; }).slice(0, 12);
    els.wrongList.innerHTML = keys.length
        ? keys.map(function (k) {
            var p = k.split('|');
            return '<span class="wrong-item"><span class="wc">' + escapeHtml(p[0]) + '</span>'
                + '<span class="wp">' + escapeHtml(p[1]) + '</span>'
                + '<span class="wn">×' + S.wrongMap[k] + '</span></span>';
        }).join('')
        : '<span class="wrong-empty">✓ 一字未错，心无罣碍</span>';

    showPage('end');
}

// ============================================================
// 页面切换与流程
// ============================================================
function showPage(name) {
    els.pageSelect.classList.toggle('hidden', name !== 'select');
    els.pageChapter.classList.toggle('hidden', name !== 'chapter');
    els.pageGame.classList.toggle('hidden', name !== 'game');
    els.pageEnd.classList.toggle('hidden', name !== 'end');
    // 默写模式隐藏结果统计项
    document.getElementById('stats-bar').classList.toggle('recite', MODE === 'recite');
    if (name === 'select') {
        renderSelect();
        els.statSutra.textContent = '—';
        els.statSec.textContent = '0';
        els.statSecTotal.textContent = '0';
        els.statTime.textContent = '00:00';
        els.statAcc.textContent = '100%';
        els.statCpm.textContent = '0';
        els.progressFill.style.width = '0';
    }
    if (name === 'end') els.pageEnd.querySelector('.end-card').classList.add('fade-in');
}

function startSutra(sutra, chIdx, startSec, fullBook) {
    if (timer) { clearInterval(timer); timer = null; }
    newGame(sutra, chIdx, startSec, fullBook);
    // 模式相关 UI
    var isRecite = MODE === 'recite';
    els.copyInput.placeholder = isRecite
        ? '凭记忆默写经文，写对显绿、写错显红…'
        : '用中文输入法在此逐字抄写经文…';
    els.hintLine.innerHTML = isRecite
        ? '凭记忆默写 · 对绿错红 · 整句写对自动下一句 · <kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd> 上/下一句 · <kbd>Esc</kbd> 退出'
        : '用中文输入法逐字抄写 · 错字标红波浪线 · 整句抄对自动下一句 · <kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd> 上/下一句 · <kbd>Esc</kbd> 退出';
    showPage('game');
    renderSection();
    updateNavButtons();
    els.copyInput.focus();
}

function quitGame() {
    if (timer) { clearInterval(timer); timer = null; }
    if (S && !S.finished) {
        saveProgress(S.sutra.id, { chIdx: S.chIdx, secIdx: S.secIdx, ts: Date.now() });
    }
    S = null;
    updateNavButtons();
    showPage('select');
}

// ============================================================
// 事件绑定

els.chapterGrid.addEventListener('click', function (e) {
    var card = e.target.closest('.chapter-card');
    if (!card || !chapterSutra) return;
    var ci = parseInt(card.getAttribute('data-ci'), 10);
    var prog = getProgress()[chapterSutra.id] || {};
    // 续打：进度正好在本章时从断点句开始，否则从头
    var startSec = (prog.chIdx || 0) === ci ? (prog.secIdx || 0) : 0;
    startSutra(chapterSutra, ci, startSec, false);

document.getElementById('btn-chapter-all').addEventListener('click', function () {

});
document.getElementById('btn-chapter-back').addEventListener('click', function () {
    showPage('select');
});

document.getElementById('btn-quit').addEventListener('click', quitGame);
// 极简模式：游戏页文字按钮开启，右上角标关闭
document.getElementById('btn-minimal').addEventListener('click', function () { setMinimal(true); });
document.getElementById('minimal-badge').addEventListener('click', function () { setMinimal(false); });
document.getElementById('btn-restart').addEventListener('click', function () {
    if (!S) return;
    S.tokIdx = 0;
    renderSection();
    els.copyInput.focus();
});
// 上一句 / 下一句
els.btnPrevSec.addEventListener('click', function () { gotoSection(-1); });
els.btnNextSec.addEventListener('click', function () { gotoSection(1); });
document.getElementById('btn-back').addEventListener('click', function () {
    // 多章经退回选分页，其余退回选经页
    if (S && S.sutra.chapters.length > 1 && !S.fullBook) {
        renderChapters(S.sutra);
        S = null;
        showPage('chapter');
    } else {
        S = null;
        showPage('select');
    }
});
document.getElementById('btn-again').addEventListener('click', function () {
    if (S) startSutra(S.sutra, S.chIdx, 0, S.fullBook);
});
document.getElementById('btn-next').addEventListener('click', function () {
    if (!S) return;
    var i = SUTRAS.findIndex(function (x) { return x.id === S.sutra.id; });
    openSutra(SUTRAS[(i + 1) % SUTRAS.length], 'start');
});

els.btnTheme.addEventListener('click', function () { applyTheme(!isDark()); });
els.keyVolume.addEventListener('input', function () {
    els.keyVolumeLabel.textContent = els.keyVolume.value + '%';
    try { localStorage.setItem(KEY_VOLUME_STORAGE, els.keyVolume.value); } catch (e) {}
});

// 模式切换（选经页）
els.modeSwitch.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    MODE = btn.getAttribute('data-mode');
    try { localStorage.setItem(MODE_KEY, MODE); } catch (err) {}
    document.getElementById('stats-bar').classList.toggle('recite', MODE === 'recite');
    renderSelect();
});

// 抄写/默写输入框
els.copyInput.addEventListener('input', function () {
    if (!S || S.finished) return;
    if (MODE === 'recite') { ensureTimer(); updateReciteState(); return; }
    if (MODE !== 'copy') return;
    ensureTimer();
    playKeyClick(getKeyVolume());
    updateCopyState();
});
els.copyInput.addEventListener('keydown', function (e) {
    // Alt + ←/→：上一句 / 下一句（输入法候选词用普通方向键，不冲突）
    if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        gotoSection(e.key === 'ArrowLeft' ? -1 : 1);
        e.stopPropagation();
        return;
    }
    if (e.key === 'Escape') {
        e.preventDefault();
        if (MINIMAL) setMinimal(false);
        else quitGame();
    }
    e.stopPropagation();   // 避免 document 级 onKey 重复处理
});

document.addEventListener('keydown', onKey);

// ============================================================
// 启动
// ============================================================
try {
    var savedMode = localStorage.getItem(MODE_KEY);
    if (savedMode === 'copy' || savedMode === 'recite') MODE = savedMode;
    MINIMAL = localStorage.getItem(MINIMAL_KEY) === '1';
    if (MINIMAL) document.body.classList.add('minimal');
} catch (e) {}
restoreVolume();
els.btnTheme.textContent = isDark() ? '☀️' : '🌙';
showPage('select');
</script>
</body>
</html>
